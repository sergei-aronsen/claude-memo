version: 2

# One pull request a month with every update, majors included, across all
# ecosystems below. A weekly stream of per-ecosystem pull requests got
# superseded before anyone merged it and only produced notification noise.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
