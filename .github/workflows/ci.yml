name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: "CI (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff mypy types-PyYAML bandit==1.9.4 pip-audit pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Format check (ruff)
        run: ruff format --check scripts/ tests/

      - name: Type check (mypy)
        run: mypy scripts/

      - name: Security scan (bandit)
        run: bandit -r scripts/ -ll

      - name: Dependency audit
        # CVE-2026-1839 (transformers Trainer._load_rng_state arbitrary
        # code execution via malicious checkpoint) does not apply: we use
        # transformers only for SentenceTransformer.encode inference, no
        # Trainer, no checkpoint loading from untrusted sources. The fix
        # ships in transformers 5.0.0rc3 (release candidate) which
        # sentence-transformers <3.5 doesn't accept yet.
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-69w3-r845-3855

      - name: Unit tests
        run: pytest tests/ --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
