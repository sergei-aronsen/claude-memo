name: CI

on:
  # Docs-only changes (README, references/, docs/) skip CI: nothing it checks changes.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

# A newer push to the same PR makes the running check obsolete; runs on main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: "CI (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The workflow is part of the key: how torch is installed changes what the cache holds.
          cache-dependency-path: |
            requirements.txt
            .github/workflows/ci.yml

      # CPU-only torch: the default Linux wheel pulls ~3 GB of CUDA libraries.
      # Nothing in CI needs a GPU, tests stub sentence_transformers, and mypy
      # sees the same torch sources in both builds.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff mypy types-PyYAML bandit==1.9.4 pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Format check (ruff)
        run: ruff format --check scripts/ tests/

      # mypy re-analyses torch/transformers on every run; its incremental cache
      # checks each file's hash, so a cache restored by prefix stays correct.
      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml', 'scripts/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Type check (mypy)
        run: mypy scripts/

      - name: Security scan (bandit)
        run: bandit -r scripts/ -ll

      - name: Unit tests
        run: pytest tests/ --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # pip-audit resolves requirements.txt in its own temporary venv and needs
  # nothing from the main job, so it runs beside it instead of adding ~10 s.
  audit:
    name: "Dependency audit (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency audit
        run: pip-audit -r requirements.txt
