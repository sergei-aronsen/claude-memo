name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: "CI (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff mypy types-PyYAML bandit==1.9.4 pip-audit pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Format check (ruff)
        run: ruff format --check scripts/ tests/

      - name: Type check (mypy)
        run: mypy scripts/

      - name: Security scan (bandit)
        run: bandit -r scripts/ -ll

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Unit tests
        run: pytest tests/ --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
