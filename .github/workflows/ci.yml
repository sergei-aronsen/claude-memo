name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: "CI (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff mypy types-PyYAML bandit==1.9.4 pip-audit pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check scripts/

      - name: Format check (ruff)
        run: ruff format --check scripts/

      - name: Type check (mypy)
        run: mypy scripts/memo_engine.py scripts/auto_memo.py

      - name: Security scan (bandit)
        run: bandit -r scripts/ -ll

      - name: Dependency audit
        # CVE-2026-1839 (transformers Trainer._load_rng_state arbitrary
        # code execution via malicious checkpoint) does not apply: we use
        # transformers only for SentenceTransformer.encode inference, no
        # Trainer, no checkpoint loading from untrusted sources. The fix
        # ships in transformers 5.0.0rc3 (release candidate) which
        # sentence-transformers <3.5 doesn't accept yet.
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-69w3-r845-3855

      - name: Unit tests
        run: pytest tests/ --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
