name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: "CI (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff mypy types-PyYAML bandit==1.9.4 pip-audit pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Format check (ruff)
        run: ruff format --check scripts/ tests/

      - name: Type check (mypy)
        run: mypy scripts/

      - name: Security scan (bandit)
        run: bandit -r scripts/ -ll

      - name: Dependency audit
        # Two transformers advisories are suppressed; BOTH are checkpoint /
        # untrusted-model-file deserialization RCEs, and NEITHER is reachable
        # here: claude-memo uses transformers only for SentenceTransformer.encode
        # inference against a fixed, trusted model (intfloat/multilingual-e5-large).
        # It never loads untrusted checkpoints, runs Trainer, or converts models.
        #   - GHSA-69w3-r845-3855 / CVE-2026-1839: Trainer._load_rng_state RCE
        #     via malicious checkpoint.
        #   - PYSEC-2025-217 / CVE-2025-14929: X-CLIP checkpoint-conversion
        #     deserialization RCE.
        # Both are fixed only in transformers 5.0.0rc+ which sentence-transformers
        # <3.5 does not accept yet, so we cannot bump out of them.
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-69w3-r845-3855 --ignore-vuln PYSEC-2025-217

      - name: Unit tests
        run: pytest tests/ --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
